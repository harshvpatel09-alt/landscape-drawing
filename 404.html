<style>
/* Layout: navy cutting-mat sidebar + paper workspace; lessons are "plates" (wide art field, narrow textbook column). */
:root {
  /* surfaces */
  --paper: #F2F3F0;
  --sheet: #FBFBF9;
  --sheet-2: #EEEFEB;
  --rule: #D8DAD4;
  --rule-strong: #B9BCB5;
  /* ink */
  --ink: #1F2124;
  --ink-2: #4E5258;
  --ink-3: #6E7278;
  --on-ink: #F7F7F4;
  /* mat (navigation) */
  --mat: #1B2433;
  --mat-2: #243047;
  --mat-line: rgba(255,255,255,.055);
  --mat-ink: #E8ECF2;
  --mat-ink-2: #A3AEC0;
  /* non-photo blue: construction lines, focus, interactive highlight */
  --blue: #3E8FC7;
  --blue-ink: #1D5C8C;
  --blue-wash: rgba(62,143,199,.12);
  /* semantic */
  --good: #2E7650;
  --good-wash: rgba(46,118,80,.11);
  --warn: #946514;
  --warn-wash: rgba(148,101,20,.12);
  --bad: #A63A2E;
  --bad-wash: rgba(166,58,46,.10);
  /* the plate stays paper in both themes: values must read true */
  --plate: #F7F6F2;
  --plate-edge: #DCDAD3;
  /* graphite value scale (fixed; used by art + value lessons) */
  --v0:#F7F6F2; --v1:#E3E2DD; --v2:#CDCBC5; --v3:#B3B1AB; --v4:#97958F;
  --v5:#7A7873; --v6:#5E5C58; --v7:#43423E; --v8:#2A2926;

  /* type */
  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --t-12: .75rem; --t-14: .875rem; --t-16: 1rem; --t-18: 1.125rem; --t-22: 1.375rem;
  --t-28: 1.75rem; --t-36: 2.25rem; --t-48: 3rem; --t-64: 4rem;

  /* space (4pt rhythm) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;

  /* shape: art is nearly square (tipped-in prints); controls are soft; chips are round */
  --r-art: 2px; --r-ctl: 8px; --r-panel: 12px; --r-pill: 999px;

  /* elevation: only plates and overlays lift off the page */
  --lift-plate: 0 1px 0 rgba(0,0,0,.04), 0 10px 28px -16px rgba(20,24,30,.35);
  --lift-over: 0 18px 48px -18px rgba(10,14,22,.45);

  /* motion */
  --ease-out: cubic-bezier(.2,.7,.2,1);
  --d-fast: 140ms; --d-mid: 220ms; --d-slow: 420ms;
  --sidebar: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#15181C; --sheet:#1C2025; --sheet-2:#232830; --rule:#2F353D; --rule-strong:#48505A;
    --ink:#E9EAE6; --ink-2:#B5BAC1; --ink-3:#8F959D; --on-ink:#15181C;
    --mat:#10151F; --mat-2:#1A2231; --mat-line:rgba(255,255,255,.04); --mat-ink:#E3E8EF; --mat-ink-2:#93A0B3;
    --blue:#6FB2E3; --blue-ink:#8CC3EC; --blue-wash:rgba(111,178,227,.14);
    --good:#6CC196; --good-wash:rgba(108,193,150,.13); --warn:#D9A94A; --warn-wash:rgba(217,169,74,.13);
    --bad:#E88878; --bad-wash:rgba(232,136,120,.12);
    --plate:#E9E8E3; --plate-edge:#3A3F46;
    --lift-plate: 0 1px 0 rgba(0,0,0,.3), 0 14px 32px -18px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper:#15181C; --sheet:#1C2025; --sheet-2:#232830; --rule:#2F353D; --rule-strong:#48505A;
  --ink:#E9EAE6; --ink-2:#B5BAC1; --ink-3:#8F959D; --on-ink:#15181C;
  --mat:#10151F; --mat-2:#1A2231; --mat-line:rgba(255,255,255,.04); --mat-ink:#E3E8EF; --mat-ink-2:#93A0B3;
  --blue:#6FB2E3; --blue-ink:#8CC3EC; --blue-wash:rgba(111,178,227,.14);
  --good:#6CC196; --good-wash:rgba(108,193,150,.13); --warn:#D9A94A; --warn-wash:rgba(217,169,74,.13);
  --bad:#E88878; --bad-wash:rgba(232,136,120,.12);
  --plate:#E9E8E3; --plate-edge:#3A3F46;
  --lift-plate: 0 1px 0 rgba(0,0,0,.3), 0 14px 32px -18px rgba(0,0,0,.8);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 var(--t-16)/1.55 var(--font-ui);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.012em; }
h1 { font-size: clamp(var(--t-36), 4.2vw, var(--t-48)); }
h2 { font-size: var(--t-28); }
h3 { font-size: var(--t-22); }
h4 { font-size: var(--t-18); }
p { margin: 0; }
a { color: var(--blue-ink); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
svg { max-width: 100%; }
svg.scene { display: block; }
svg.ic { display: inline-block; vertical-align: -.15em; flex: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--ink); color: var(--on-ink); padding: 8px 12px; border-radius: var(--r-ctl); }
.skip:focus { top: 8px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: var(--t-14); }
.tiny { font-size: var(--t-12); color: var(--ink-3); }
.prose { font-family: var(--font-display); font-size: var(--t-18); line-height: 1.6; max-width: 62ch; }
.prose p + p { margin-top: .8em; }
.prose strong { font-weight: 600; }
.label { font-size: var(--t-14); font-weight: 600; color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: var(--s4); }
.row { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100%; }
.mat {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background-color: var(--mat); color: var(--mat-ink);
  background-image:
    linear-gradient(var(--mat-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 24px 24px;
  display: flex; flex-direction: column; padding: var(--s5) var(--s4);
  gap: var(--s5);
}
.brand { display: flex; gap: var(--s3); align-items: center; padding: 0 var(--s2); color: var(--mat-ink); text-decoration: none; }
.brand-mark { width: 36px; height: 36px; flex: none; }
.brand-name { font-family: var(--font-display); font-size: var(--t-18); line-height: 1.1; }
.brand-name small { display: block; font-family: var(--font-ui); font-size: var(--t-12); color: var(--mat-ink-2); letter-spacing: .01em; }
.nav { display: flex; flex-direction: column; gap: var(--s5); }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group > span { font-size: var(--t-12); color: var(--mat-ink-2); padding: 0 var(--s3) var(--s1); }
.nav a {
  display: flex; align-items: center; gap: var(--s3); min-height: 40px; padding: 0 var(--s3);
  border-radius: var(--r-ctl); color: var(--mat-ink); text-decoration: none; font-size: var(--t-14); font-weight: 500;
  transition: background var(--d-fast) var(--ease-out);
}
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .8; }
.nav a:hover { background: rgba(255,255,255,.06); }
.nav a[aria-current="page"] { background: var(--mat-2); }
.nav a[aria-current="page"] svg { opacity: 1; color: var(--blue); }
.nav .count { margin-left: auto; font-size: var(--t-12); color: var(--mat-ink-2); }
.mat-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--s3); font-size: var(--t-12); color: var(--mat-ink-2); padding: 0 var(--s2); }
.mat-progress { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3); border: 1px solid rgba(255,255,255,.08); border-radius: var(--r-ctl); }
.mat-progress b { color: var(--mat-ink); font-weight: 600; font-size: var(--t-14); }
.sync { display: flex; align-items: center; gap: 6px; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--mat-ink-2); }
.sync.on i { background: #6CC196; }

main { min-width: 0; }
.view { padding: var(--s7) clamp(var(--s4), 4vw, var(--s8)) var(--s9); max-width: 1240px; margin: 0 auto; }
.view:focus { outline: none; }
.page-head { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s6); max-width: 70ch; }
.page-head p { color: var(--ink-2); font-size: var(--t-18); }
.section { margin-top: var(--s8); }
.section-head { display: flex; align-items: baseline; gap: var(--s4); margin-bottom: var(--s4); flex-wrap: wrap; }
.section-head h2 { font-size: var(--t-22); }
.section-head .spacer + a, .section-head a { font-size: var(--t-14); }

.tabbar { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 44px; padding: 0 var(--s5); border-radius: var(--r-ctl);
  border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink);
  font-weight: 600; font-size: var(--t-14); cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background var(--d-fast) var(--ease-out), border-color var(--d-fast), transform var(--d-fast);
  touch-action: manipulation;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { border-color: var(--ink-3); background: var(--sheet-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-quiet { border-color: transparent; background: transparent; padding: 0 var(--s3); }
.btn-quiet:hover { background: var(--sheet-2); border-color: transparent; }
.btn-quiet[aria-pressed="true"] { background: var(--blue-wash); color: var(--blue-ink); }
.btn-lg { min-height: 52px; padding: 0 var(--s6); font-size: var(--t-16); }
.btn-sm { min-height: 36px; padding: 0 var(--s3); font-size: var(--t-14); }
.btn.is-busy { pointer-events: none; }
.btn.is-busy::after { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: var(--r-ctl); border: 0; background: transparent; cursor: pointer; color: inherit; }
.icon-btn:hover { background: var(--sheet-2); }
.icon-btn svg { width: 20px; height: 20px; }

/* segmented control */
.seg { display: inline-flex; padding: 3px; border-radius: var(--r-ctl); background: var(--sheet-2); border: 1px solid var(--rule); gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 32px; padding: 0 var(--s3); border-radius: 6px; font-size: var(--t-14); font-weight: 500; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* chips: status is shape + text, never color alone */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: var(--t-12); font-weight: 600; border: 1px solid var(--rule); color: var(--ink-2); background: var(--sheet); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip.done { color: var(--good); border-color: transparent; background: var(--good-wash); }
.chip.active { color: var(--blue-ink); border-color: transparent; background: var(--blue-wash); }
.chip.practice { color: var(--warn); border-color: transparent; background: var(--warn-wash); }
.chip.locked { color: var(--ink-3); }

/* ---------- signature: hatched progress ---------- */
.hatch-bar { position: relative; height: 14px; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--sheet); overflow: hidden; }
.hatch-bar > i {
  position: absolute; inset: 0 auto 0 0; width: var(--p, 0%);
  background: repeating-linear-gradient(-45deg, var(--ink) 0 1.5px, transparent 1.5px 5px);
  border-right: 1.5px solid var(--ink);
  transition: width var(--d-slow) var(--ease-out);
}
.hatch-bar.thin { height: 8px; border-width: 1px; }
.hatch-bar.on-mat { border-color: var(--mat-ink); background: transparent; }
.hatch-bar.on-mat > i { background: repeating-linear-gradient(-45deg, var(--mat-ink) 0 1.5px, transparent 1.5px 5px); border-color: var(--mat-ink); }

/* ---------- plates (artwork frames) ---------- */
.plate { background: var(--plate); border: 1px solid var(--plate-edge); border-radius: var(--r-art); box-shadow: var(--lift-plate); overflow: hidden; position: relative; }
.plate svg.scene { width: 100%; height: auto; aspect-ratio: 8 / 5; }
.plate svg.scene.diagram { aspect-ratio: auto; }
.lesson-row .thumb svg.diagram, .rec .thumb svg.diagram, .drill svg.diagram, .unit-card svg.diagram { aspect-ratio: 8 / 5; }
.plate-bar { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s3); }
.plate-cap { font-size: var(--t-14); color: var(--ink-2); max-width: 70ch; }
.plate-no { font-family: var(--font-display); font-style: italic; color: var(--ink-3); font-size: var(--t-14); }

/* scene render modes */
svg.scene .ov { transition: opacity var(--d-mid); }
svg.scene.mode-line .tone, svg.scene .as-line .tone { fill: none !important; stroke: #6f6d69; stroke-width: 1.1; }
svg.scene.mode-line .shade, svg.scene .as-line .shade,
svg.scene.mode-line .hatch, svg.scene.mode-line .reflect, svg.scene.mode-line .fx,
svg.scene .as-line .hatch, svg.scene .as-line .reflect, svg.scene .as-line .fx { display: none; }
svg.scene.mode-notan .hatch, svg.scene.mode-notan .sketch, svg.scene.mode-two .hatch, svg.scene.mode-two .sketch { display: none; }
svg.scene.mode-line rect.tone:first-child { fill: #F7F6F2 !important; stroke: none; }
.plate::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); mix-blend-mode: multiply; opacity: .28; pointer-events: none; }
svg.scene .drawin { stroke-dasharray: var(--len, 2400); stroke-dashoffset: var(--len, 2400); animation: drawin 1.1s var(--ease-out) forwards; }
@keyframes drawin { to { stroke-dashoffset: 0; } }
svg.scene .fadein { animation: fadein .6s var(--ease-out) both; }
@keyframes fadein { from { opacity: 0; } }

/* ---------- home ---------- */
.home-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: var(--s7); align-items: center; }
.home-hero h1 { font-size: clamp(2.6rem, 5.6vw, var(--t-64)); line-height: 1; letter-spacing: -.025em; }
.home-hero .lede { font-family: var(--font-display); font-size: var(--t-22); color: var(--ink-2); margin-top: var(--s4); max-width: 30ch; line-height: 1.35; }
.hero-art { text-decoration: none; color: inherit; }
.home-hero .actions { margin-top: var(--s6); display: flex; gap: var(--s3); flex-wrap: wrap; }
.now { margin-top: var(--s6); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s5); border-top: 1px solid var(--rule); padding-top: var(--s5); }
.now dt { font-size: var(--t-12); color: var(--ink-3); font-weight: 600; margin-bottom: var(--s1); }
.now dd { margin: 0; font-size: var(--t-14); font-weight: 600; }
.now dd .hatch-bar { margin-top: 6px; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s6); }

.method { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border-top: 1.5px solid var(--ink); }
.method > div { padding: var(--s4) var(--s4) var(--s4) 0; border-right: 1px solid var(--rule); }
.method > div + div { padding-left: var(--s4); }
.method > div:last-child { border-right: 0; }
.method b { font-family: var(--font-display); font-size: var(--t-48); font-weight: 400; line-height: 1; display: block; }
.method h4 { font-family: var(--font-ui); font-size: var(--t-14); font-weight: 700; margin: var(--s2) 0 var(--s1); }
.method p { font-size: var(--t-14); color: var(--ink-2); }

/* unit strip */
.units { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s4); }
.unit-card { display: flex; flex-direction: column; gap: var(--s2); text-decoration: none; color: inherit; }
.unit-card .plate svg { aspect-ratio: 4/3; }
.unit-card .t { font-family: var(--font-display); font-size: var(--t-18); line-height: 1.2; }
.unit-card:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.unit-card .m { font-size: var(--t-12); color: var(--ink-3); display: flex; gap: var(--s2); align-items: center; }

/* next-action panel */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-panel); padding: var(--s5); }
.panel h3 { font-size: var(--t-18); }
.rec { display: flex; gap: var(--s4); align-items: flex-start; padding: var(--s4) 0; border-top: 1px solid var(--rule); }
.rec:first-of-type { border-top: 0; padding-top: 0; }
.rec .thumb { width: 88px; flex: none; }
.rec .thumb svg { aspect-ratio: 4/3; }
.rec-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rec-body b { font-weight: 600; }
.rec-body .chip { align-self: flex-start; }

/* drawings strip */
.drawings { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--s4); }
.drawing { display: flex; flex-direction: column; gap: var(--s2); text-decoration: none; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
.drawing .frame { aspect-ratio: 4/3; background: var(--plate); border: 1px solid var(--plate-edge); border-radius: var(--r-art); overflow: hidden; box-shadow: var(--lift-plate); }
.drawing img { width: 100%; height: 100%; object-fit: cover; }
.drawing .t { font-size: var(--t-14); font-weight: 600; }
.drawing .m { font-size: var(--t-12); color: var(--ink-3); }

/* empty / error states */
.empty { border: 1.5px dashed var(--rule-strong); border-radius: var(--r-panel); padding: var(--s6); display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--s5); align-items: center; }
.empty svg { width: 120px; }
.empty h3 { font-size: var(--t-18); margin-bottom: var(--s1); }
.empty p { color: var(--ink-2); font-size: var(--t-14); margin-bottom: var(--s3); }
.notice { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-ctl); font-size: var(--t-14); align-items: flex-start; }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.notice.info { background: var(--blue-wash); color: var(--ink); }
.notice.warn { background: var(--warn-wash); }
.notice.bad { background: var(--bad-wash); }
.notice.good { background: var(--good-wash); }

/* ---------- course library ---------- */
.unit-block { margin-top: var(--s7); }
.unit-block:first-of-type { margin-top: 0; }
.unit-top { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: var(--s4); align-items: end; padding-bottom: var(--s3); border-bottom: 1.5px solid var(--ink); margin-bottom: var(--s2); }
.unit-top .n { font-family: var(--font-display); font-size: var(--t-48); line-height: .9; color: var(--ink-3); align-self: start; }
.unit-top h2 { font-size: var(--t-28); }
.unit-top p { color: var(--ink-2); font-size: var(--t-14); margin-top: 2px; }
.lessons { display: flex; flex-direction: column; }
.lesson-row {
  display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: var(--s4); align-items: center;
  padding: var(--s3) var(--s2); border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit;
  border-radius: 4px; transition: background var(--d-fast);
}
a.lesson-row:hover { background: var(--sheet); }
.lesson-row .thumb svg { aspect-ratio: 8/5; }
.lesson-row .thumb .plate { box-shadow: none; }
.lesson-row.is-locked .thumb { opacity: .45; filter: grayscale(1); }
.lesson-row .t { font-family: var(--font-display); font-size: var(--t-18); line-height: 1.25; }
.lesson-row .m { display: flex; flex-wrap: wrap; gap: 4px var(--s3); font-size: var(--t-12); color: var(--ink-3); margin-top: 2px; }
.lesson-row .m span { display: inline-flex; gap: 4px; align-items: center; }
.lesson-row .m svg { width: 12px; height: 12px; }
.lvl { display: inline-flex; gap: 2px; align-items: center; }
.lvl i { width: 5px; height: 10px; border: 1px solid currentColor; border-radius: 1px; }
.lvl i.on { background: currentColor; }
.filters { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s6); }
.seg.filters { display: inline-flex; gap: 2px; max-width: 100%; }

/* ---------- lesson player ---------- */
.lesson { display: flex; flex-direction: column; min-height: 100vh; }
.lesson-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.lesson-head-in { max-width: 1320px; margin: 0 auto; padding: var(--s3) clamp(var(--s4), 3vw, var(--s6)); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4); align-items: center; }
.lesson-title { min-width: 0; }
.lesson-title .k { font-size: var(--t-12); color: var(--ink-3); font-weight: 600; }
.lesson-title .t { font-family: var(--font-display); font-size: var(--t-18); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper { display: flex; gap: 3px; margin-top: 6px; }
.stepper button { flex: 1; height: 6px; border: 0; padding: 0; border-radius: 1px; background: var(--rule); cursor: pointer; position: relative; }
.stepper button::before { content: ""; position: absolute; inset: -10px 0; }
.stepper button.done { background: var(--ink-3); }
.stepper button[aria-current="step"] { background: var(--blue); }
.lesson-main { flex: 1; width: 100%; max-width: 1320px; margin: 0 auto; padding: var(--s6) clamp(var(--s4), 3vw, var(--s6)) var(--s8); }
.stage { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: clamp(var(--s5), 3vw, var(--s7)); align-items: start; }
.stage.single { grid-template-columns: minmax(0, 900px); justify-content: center; }
.stage-art { position: sticky; top: 96px; display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.stage-text { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
.stage-kicker { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-14); color: var(--ink-3); }
.stage-kicker b { color: var(--blue-ink); font-weight: 600; }
.stage-text h2 { font-size: clamp(var(--t-28), 2.6vw, var(--t-36)); }
.callouts { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--rule); }
.callouts li { list-style: none; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--rule); font-size: var(--t-14); }
.callouts li b { font-family: var(--font-display); font-weight: 500; font-size: var(--t-18); color: var(--blue-ink); line-height: 1.2; }
ul.callouts, ol.callouts { margin: 0; padding: 0; }
.lesson-foot { position: sticky; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lesson-foot-in { max-width: 1320px; margin: 0 auto; padding: var(--s3) clamp(var(--s4), 3vw, var(--s6)); display: flex; gap: var(--s3); align-items: center; }
.lesson-foot .where { font-size: var(--t-14); color: var(--ink-3); }

/* demo player */
.demo-steps { display: flex; flex-direction: column; counter-reset: st; border-top: 1px solid var(--rule); }
.demo-steps button { counter-increment: st; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--s3); text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: var(--s3) var(--s2); cursor: pointer; border-radius: 0; color: var(--ink-2); }
.demo-steps button::before { content: counter(st); font-family: var(--font-display); font-size: var(--t-22); line-height: 1; color: var(--ink-3); }
.demo-steps button b { display: block; font-weight: 600; color: var(--ink); font-size: var(--t-14); }
.demo-steps button span { font-size: var(--t-14); display: none; margin-top: 4px; }
.demo-steps button[aria-current="step"] { background: var(--sheet); color: var(--ink); box-shadow: inset 2px 0 0 var(--blue); }
.demo-steps button[aria-current="step"]::before { color: var(--blue-ink); }
.demo-steps button[aria-current="step"] span { display: block; }

/* checklist (guided practice + completion) */
.checks { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; }
.checks li { list-style: none; border-bottom: 1px solid var(--rule); }
.checks label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s3); padding: var(--s3) 0; cursor: pointer; font-size: var(--t-16); align-items: start; }
.checks input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); cursor: pointer; }
.checks input:checked + span { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--rule-strong); }
.completion { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; }
.completion li { list-style: none; display: flex; gap: var(--s3); align-items: center; font-size: var(--t-14); color: var(--ink-3); }
.completion li .box { width: 18px; height: 18px; border: 1.5px solid var(--rule-strong); border-radius: 3px; display: grid; place-items: center; flex: none; }
.completion li.ok { color: var(--ink); }
.completion li.ok .box { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.completion li .box svg { width: 12px; height: 12px; }

/* assignment brief */
.brief { border-left: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-panel); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
.brief h3 { font-size: var(--t-22); }
.brief ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.brief .meta { display: flex; gap: var(--s4); font-size: var(--t-14); color: var(--ink-3); flex-wrap: wrap; }
.brief .meta span { display: inline-flex; gap: 6px; align-items: center; }
.brief .meta svg { width: 16px; height: 16px; }
.stretch { border-top: 1px dashed var(--rule-strong); padding-top: var(--s3); font-size: var(--t-14); }

/* interactive exercises */
.ex { position: relative; }
.ex svg.scene { cursor: crosshair; touch-action: manipulation; }
.ex .plate, .ex-fit { max-width: min(100%, calc((100vh - 300px) * 1.6)); }
.ex-bar { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.ex-result { border-radius: var(--r-ctl); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); font-size: var(--t-16); }
.ex-result.good { background: var(--good-wash); }
.ex-result.bad { background: var(--bad-wash); }
.ex-result.info { background: var(--blue-wash); }
.ex-result h4 { font-family: var(--font-ui); font-size: var(--t-16); font-weight: 700; display: flex; gap: var(--s2); align-items: center; }
.ex-result h4 svg { width: 18px; height: 18px; }
.ex-result.good h4 { color: var(--good); }
.ex-result.bad h4 { color: var(--bad); }
.label-pick { display: flex; flex-wrap: wrap; gap: var(--s2); }
.label-pick button { min-height: 40px; padding: 0 var(--s4); border-radius: var(--r-pill); border: 1.5px solid var(--rule-strong); background: var(--sheet); cursor: pointer; font-weight: 600; font-size: var(--t-14); display: inline-flex; gap: 8px; align-items: center; }
.label-pick button i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); }
.label-pick button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s4); }
.opt-card { border: 1.5px solid var(--rule); border-radius: var(--r-ctl); padding: var(--s2); background: var(--sheet); cursor: pointer; display: flex; flex-direction: column; gap: var(--s2); text-align: left; transition: border-color var(--d-fast); }
.opt-card:hover { border-color: var(--ink-3); }
.opt-card[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.opt-card.right { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
.opt-card.wrong { border-color: var(--bad); }
.opt-card .cap { font-size: var(--t-14); font-weight: 600; padding: 0 var(--s1) var(--s1); display: flex; gap: 6px; align-items: center; }
.opt-card svg.scene { aspect-ratio: 8/5; border-radius: var(--r-art); }
.order-list { display: flex; flex-direction: column; gap: var(--s2); margin: 0; padding: 0; }
.order-list li { list-style: none; display: grid; grid-template-columns: 28px 96px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s2); background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-ctl); }
.order-list li .n { font-family: var(--font-display); font-size: var(--t-22); color: var(--ink-3); text-align: center; }
.order-list li svg { aspect-ratio: 8/5; border-radius: var(--r-art); }
.order-list .mv { display: flex; gap: 2px; }
.order-list .mv button { width: 36px; height: 36px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.order-list .mv button svg { width: 16px; height: 16px; }
.swatches { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 400px; }
.swatches button { width: 100%; height: 40px; border-radius: 4px; border: 1.5px solid var(--rule-strong); cursor: pointer; font-size: var(--t-12); font-weight: 700; display: grid; place-items: end center; padding-bottom: 2px; }
.swatches button[aria-pressed="true"] { outline: 2.5px solid var(--blue); outline-offset: 2px; }
.dial { width: 180px; height: 180px; touch-action: none; cursor: pointer; }

/* quiz */
.quiz { display: flex; flex-direction: column; gap: var(--s6); }
.q h4 { font-family: var(--font-display); font-size: var(--t-22); font-weight: 500; margin-bottom: var(--s3); }
.q .opts { display: flex; flex-direction: column; gap: var(--s2); }
.q .opts button { text-align: left; min-height: 48px; padding: var(--s3) var(--s4); border: 1.5px solid var(--rule); border-radius: var(--r-ctl); background: var(--sheet); cursor: pointer; font-size: var(--t-16); display: flex; gap: var(--s3); align-items: center; }
.q .opts button:hover { border-color: var(--ink-3); }
.q .opts button .k { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.5px solid var(--rule-strong); display: grid; place-items: center; font-size: var(--t-12); font-weight: 700; color: var(--ink-3); }
.q .opts button.right { border-color: var(--good); background: var(--good-wash); }
.q .opts button.right .k { background: var(--good); border-color: var(--good); color: #fff; }
.q .opts button.wrong { border-color: var(--bad); background: var(--bad-wash); }
.q .opts button[disabled] { cursor: default; }
.q .why { margin-top: var(--s3); font-size: var(--t-14); color: var(--ink-2); padding-left: var(--s4); border-left: 2px solid var(--rule-strong); }

/* upload */
.drop { border: 1.5px dashed var(--rule-strong); border-radius: var(--r-panel); background: var(--sheet); padding: var(--s6) var(--s5); display: flex; flex-direction: column; align-items: center; gap: var(--s3); text-align: center; cursor: pointer; transition: border-color var(--d-fast), background var(--d-fast); }
.drop:hover, .drop.drag { border-color: var(--blue); background: var(--blue-wash); }
.drop svg { width: 40px; height: 40px; color: var(--ink-3); }
.drop b { font-size: var(--t-16); }
.drop .tiny { max-width: 38ch; }
.preview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s3); }
.preview figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
[data-sub], [data-pick] { display: flex; flex-direction: column; gap: var(--s4); }
.preview .plate > span { text-align: center; padding: var(--s3); }
.preview figcaption { font-size: var(--t-12); color: var(--ink-3); }
.preview img, .preview .plate { width: 100%; aspect-ratio: 4/3; object-fit: contain; background: var(--plate); border: 1px solid var(--plate-edge); border-radius: var(--r-art); }

/* feedback */
.fb { display: flex; flex-direction: column; gap: 0; border-top: 1.5px solid var(--ink); }
.fb section { padding: var(--s4) 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: var(--s4); }
.fb section > h4 { font-family: var(--font-ui); font-size: var(--t-14); font-weight: 700; color: var(--ink-2); }
.fb section.key > h4 { color: var(--blue-ink); }
.fb section.key p { font-family: var(--font-display); font-size: var(--t-22); line-height: 1.35; }
.fb ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.fb .scores { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); }
.fb .score { display: flex; flex-direction: column; gap: 4px; min-width: 110px; font-size: var(--t-12); color: var(--ink-3); }
.fb .score .hatch-bar { width: 110px; }
.skeleton { background: linear-gradient(90deg, var(--sheet-2) 0 40%, var(--rule) 50%, var(--sheet-2) 60% 100%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; border-radius: 4px; height: 14px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.thinking { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4) 0; }
.selfcheck { display: flex; flex-direction: column; gap: var(--s3); }
.selfcheck .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; border-bottom: 1px solid var(--rule); font-size: var(--t-14); }

/* sketch pad */
.pad { display: flex; flex-direction: column; gap: var(--s2); }
.pad-surface { position: relative; background: var(--plate); border: 1px solid var(--plate-edge); border-radius: var(--r-art); box-shadow: var(--lift-plate); overflow: hidden; aspect-ratio: 8/5; touch-action: none; }
.pad-surface canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pad-surface canvas.guides { pointer-events: none; }
.pad-tools { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.pad-tools .seg button { min-width: 44px; }

/* reference mode */
.ref-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: var(--s6); align-items: start; }
.ref-stage { position: sticky; top: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
.ref-view { position: relative; background: var(--plate); border: 1px solid var(--plate-edge); border-radius: var(--r-art); box-shadow: var(--lift-plate); overflow: hidden; }
.ref-view canvas { display: block; width: 100%; height: auto; }
.ref-view svg.ovl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.range { display: grid; grid-template-columns: 110px minmax(0, 1fr) 40px; gap: var(--s3); align-items: center; font-size: var(--t-14); }
.range input { width: 100%; accent-color: var(--ink); }
.step-now { display: none; }
.plan { counter-reset: pl; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan li { counter-increment: pl; list-style: none; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--rule); align-items: start; }
.plan li::before { content: counter(pl); font-family: var(--font-display); font-size: var(--t-28); line-height: 1; color: var(--ink-3); }
.plan li b { display: block; font-weight: 600; }
.plan li p { font-size: var(--t-14); color: var(--ink-2); margin-top: 2px; }
.plan li input { width: 20px; height: 20px; accent-color: var(--ink); margin-top: 4px; }
.plan li.done::before { color: var(--good); }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: var(--s2) var(--s4); font-size: var(--t-14); margin: 0; }
.kv dt { color: var(--ink-3); font-weight: 600; }
.kv dd { margin: 0; }

/* practice */
.drill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s5); }
.drill { display: flex; flex-direction: column; gap: var(--s2); text-decoration: none; color: inherit; }
.drill .plate svg { aspect-ratio: 8/5; }
.drill .t { font-family: var(--font-display); font-size: var(--t-18); line-height: 1.25; }
.drill .m { display: flex; gap: var(--s3); font-size: var(--t-12); color: var(--ink-3); flex-wrap: wrap; align-items: center; }
.drill:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.timer { font-family: var(--font-display); font-size: var(--t-48); line-height: 1; font-variant-numeric: tabular-nums; }

/* progress */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); }
.stats > div { padding: var(--s4) var(--s4) var(--s4) 0; }
.stats > div + div { padding-left: var(--s4); border-left: 1px solid var(--rule); }
.stats b { display: block; font-family: var(--font-display); font-size: var(--t-36); font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: var(--t-14); color: var(--ink-2); }
.skillbars { display: flex; flex-direction: column; gap: var(--s3); }
.skillbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: var(--s4); align-items: center; font-size: var(--t-14); }
.skillbar .v { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s6); }
.list-plain { margin: 0; padding: 0; display: flex; flex-direction: column; }
.list-plain li { list-style: none; padding: var(--s3) 0; border-bottom: 1px solid var(--rule); display: flex; gap: var(--s3); align-items: flex-start; font-size: var(--t-14); }
.list-plain li svg { width: 16px; height: 16px; flex: none; margin-top: 3px; }

/* skill tree */
.tree-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-panel); padding: var(--s4); }
.tree { min-width: 880px; width: 100%; height: auto; }
.tree .node { cursor: pointer; }
.tree .node:focus { outline: none; }
.tree .node:focus-visible .ring { stroke: var(--blue); stroke-width: 3; }
.tree text { font-family: var(--font-ui); fill: var(--ink); }
.tree .tier { font-family: var(--font-display); font-size: 15px; fill: var(--ink-3); }
.legend { display: flex; gap: var(--s5); flex-wrap: wrap; font-size: var(--t-14); color: var(--ink-2); margin-top: var(--s3); }
.legend span { display: inline-flex; gap: 8px; align-items: center; }
.legend svg { width: 18px; height: 18px; }

/* modal / sheet */
.scrim { position: fixed; inset: 0; background: rgba(12,16,22,.55); z-index: 60; display: grid; place-items: center; padding: var(--s4); animation: fadein var(--d-mid) var(--ease-out); }
.sheet { background: var(--paper); border-radius: var(--r-panel); box-shadow: var(--lift-over); width: min(980px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: var(--s6); position: relative; }
.sheet .close { position: absolute; top: var(--s3); right: var(--s3); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: var(--s3) var(--s5); border-radius: var(--r-ctl); font-size: var(--t-14); font-weight: 500; z-index: 80; box-shadow: var(--lift-over); display: flex; gap: var(--s3); align-items: center; animation: toastin var(--d-mid) var(--ease-out); }
.toast svg { width: 16px; height: 16px; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } }

/* settings */
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s4); align-items: center; padding: var(--s4) 0; border-bottom: 1px solid var(--rule); }
.setting b { display: block; }
.setting p { font-size: var(--t-14); color: var(--ink-2); }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--rule-strong); transition: background var(--d-fast); pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--sheet); transition: transform var(--d-fast) var(--ease-out); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--ink); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.danger { color: var(--bad); border-color: var(--bad); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .units { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .home-hero { gap: var(--s6); }
}
@media (max-width: 1023px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .mat { display: none; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--mat); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; color: var(--mat-ink-2); text-decoration: none; font-size: 11px; font-weight: 600; border-radius: var(--r-ctl); }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--mat-ink); background: var(--mat-2); }
  .tabbar a[aria-current="page"] svg { color: var(--blue); }
  .view { padding-bottom: 120px; padding-top: var(--s6); }
  .lesson .lesson-foot { bottom: 0; }
  body.in-lesson .tabbar { display: none; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .stage-art { position: static; }
  .ref-layout { grid-template-columns: minmax(0, 1fr); }
  .ref-stage { position: static; }
  .step-now { display: flex; flex-direction: column; gap: 6px; padding: var(--s4); background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-panel); }
  .step-now p { font-size: var(--t-16); }
  .home-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .home-hero { grid-template-columns: minmax(0, 1fr); }
  .home-hero .actions .btn { flex: 1 1 auto; }
  .now { grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
  .method { grid-template-columns: minmax(0, 1fr); }
  .method > div, .method > div + div { border-right: 0; border-bottom: 1px solid var(--rule); padding: var(--s3) 0; display: grid; grid-template-columns: 48px minmax(0, 1fr); column-gap: var(--s3); }
  .method b { font-size: var(--t-36); grid-row: span 2; }
  .method h4 { margin-top: 0; }
  .units { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lesson-row { grid-template-columns: 84px minmax(0, 1fr); }
  .lesson-row > .chip, .lesson-row > .st { grid-column: 2; justify-self: start; }
  .unit-top { grid-template-columns: 48px minmax(0, 1fr); }
  .unit-top .n { font-size: var(--t-36); }
  .unit-top > :last-child { grid-column: 1 / -1; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats > div:nth-child(3) { border-left: 0; padding-left: 0; }
  .stats > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .two-col { grid-template-columns: minmax(0, 1fr); }
  .fb section { grid-template-columns: minmax(0, 1fr); gap: var(--s2); }
  .skillbar { grid-template-columns: 110px minmax(0, 1fr) 48px; gap: var(--s3); }
  .empty { grid-template-columns: minmax(0, 1fr); }
  .empty svg { width: 90px; }
  .preview { grid-template-columns: minmax(0, 1fr); }
  .lesson-head-in { grid-template-columns: auto minmax(0, 1fr); }
  .lesson-head-in > :last-child { display: none; }
  .order-list li { grid-template-columns: 24px 72px minmax(0, 1fr); }
  .order-list .mv { grid-column: 1 / -1; justify-content: flex-end; }
  .sheet { padding: var(--s5) var(--s4); }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: var(--s2); }
  .lesson-foot .where { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  svg.scene .drawin { stroke-dashoffset: 0; }
}

</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="mat" id="mat" aria-label="Sidebar"></aside>
  <main id="main"><div id="view" class="view" tabindex="-1"></div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<script>
/* Scene renderer: procedurally drawn graphite landscape plates.
   Every scene is a stack of named layers + metadata (horizon, vanishing points, focal point,
   light, regions) so lessons can build it up step by step, switch value modes and ask questions about it. */
(function () {
  const W = 800, H = 500;
  const VAL = ['#F7F6F2', '#E3E2DD', '#CDCBC5', '#B3B1AB', '#97958F', '#7A7873', '#5E5C58', '#43423E', '#2A2926'];
  const BLUE = '#3E8FC7';
  let uid = 0;

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const f = (n) => Math.round(n * 10) / 10;
  const pts = (a) => a.map((p) => f(p[0]) + ',' + f(p[1])).join(' ');
  const dPath = (a, close = true) => 'M' + a.map((p) => f(p[0]) + ' ' + f(p[1])).join('L') + (close ? 'Z' : '');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* value mapping per render mode */
  function palette(mode) {
    if (mode === 'notan') return (v) => VAL[v <= 2 ? 0 : v <= 5 ? 4 : 8];
    if (mode === 'two') return (v) => VAL[v <= 4 ? 0 : 8];
    return (v) => VAL[Math.max(0, Math.min(8, Math.round(v)))];
  }

  /* ---------- primitives ---------- */
  const tone = (P, a, v, extra = '') => `<path class="tone" d="${dPath(a)}" fill="${P(v)}" ${extra}/>`;
  const shade = (P, a, v) => `<path class="tone shade" d="${dPath(a)}" fill="${P(v)}"/>`;
  let hr = rng(1); // seeded per scene build so plates are stable between renders
  const dOpen = (a) => 'M' + a.map((p) => f(p[0]) + ' ' + f(p[1])).join('L');
  /* Hatching made of short, slightly uneven pencil strokes clipped to the shape,
     instead of a perfectly repeating pattern. */
  const HATCH = { d: [-58, 5.2], b: [58, 5.2], h: [0, 6.2], v: [90, 4.4], x: [-45, 6.4] };
  function hatch(a, kind = 'd', op = 0.5) {
    if (!a || a.length < 3) return '';
    const id = 'cl' + (++uid);
    const passes = kind === 'x' ? [HATCH.x[0], 45] : [HATCH[kind] ? HATCH[kind][0] : -58];
    const sp = (HATCH[kind] || HATCH.d)[1];
    const buckets = ['', '', ''];
    passes.forEach((deg) => {
      const th = (deg * Math.PI) / 180, ux = Math.cos(th), uy = Math.sin(th), nx = -uy, ny = ux;
      let nmin = 1e9, nmax = -1e9, umin = 1e9, umax = -1e9;
      a.forEach(([x, y]) => { const n = x * nx + y * ny, u = x * ux + y * uy; nmin = Math.min(nmin, n); nmax = Math.max(nmax, n); umin = Math.min(umin, u); umax = Math.max(umax, u); });
      for (let t = nmin + hr() * sp; t < nmax; t += sp * (0.75 + hr() * 0.5)) {
        let pos = umin - 10 + hr() * 20;
        while (pos < umax) {
          const len = 16 + hr() * 46;
          const tj = (hr() - 0.5) * 1.6, bend = (hr() - 0.5) * 2.2;
          const x0 = nx * t + ux * pos, y0 = ny * t + uy * pos;
          const x1 = nx * (t + tj) + ux * (pos + len), y1 = ny * (t + tj) + uy * (pos + len);
          const mx = (x0 + x1) / 2 + nx * bend, my = (y0 + y1) / 2 + ny * bend;
          buckets[Math.floor(hr() * 3)] += `M${f(x0)} ${f(y0)}Q${f(mx)} ${f(my)} ${f(x1)} ${f(y1)}`;
          pos += len + (hr() * 7 - 2.5);
        }
      }
    });
    return `<g class="hatch"><clipPath id="${id}"><path d="${dPath(a)}"/></clipPath><g clip-path="url(#${id})" fill="none" stroke="#2A2926" stroke-linecap="round">` +
      `<path d="${buckets[0]}" stroke-width=".75" opacity="${f(Math.min(1, op * 0.75) * 100) / 100}"/><path d="${buckets[1]}" stroke-width="1" opacity="${f(Math.min(1, op * 1.05) * 100) / 100}"/><path d="${buckets[2]}" stroke-width="1.3" opacity="${f(Math.min(1, op * 1.3) * 100) / 100}"/></g></g>`;
  }
  /* A contour restated twice with a slight offset, the way a pencil line gets re-drawn. */
  function sketch(a, c, w = 1, op = 0.6, close = false) {
    const d = close ? dPath(a) : dOpen(a);
    const dx = f(hr() * 1.8 - 0.9), dy = f(hr() * 1.4 - 0.5);
    return `<path class="ln sketch" d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>` +
      `<path class="ln sketch fx" d="${d}" transform="translate(${dx} ${dy})" fill="none" stroke="${c}" stroke-width="${f(w * 0.65)}" stroke-linecap="round" stroke-linejoin="round" opacity="${f(op * 0.45)}"/>`;
  }
  /* Light pencil tone in the upper sky, darker toward the top of the page. */
  const skyTone = (y) => hatch([[-5, -5], [W + 5, -5], [W + 5, y * 0.55], [-5, y * 0.48]], 'h', 0.13) + hatch([[-5, -5], [W + 5, -5], [W + 5, y * 0.24], [-5, y * 0.3]], 'h', 0.13);
  const stroke = (x1, y1, x2, y2, c, w = 1, cls = 'fx', extra = '') => `<line class="${cls}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;

  function jag(a, amt, r, subdiv = 2) {
    const out = [];
    const idx = [];
    for (let i = 0; i < a.length - 1; i++) {
      const [x0, y0] = a[i], [x1, y1] = a[i + 1];
      idx.push(out.length);
      out.push([x0, y0]);
      const len = Math.hypot(x1 - x0, y1 - y0) || 1;
      const n = Math.max(subdiv, Math.round(len / 15));
      const nx = -(y1 - y0) / len, ny = (x1 - x0) / len;
      const k0 = amt * Math.min(1.5, 0.35 + len / 150);
      let drift = 0;
      for (let k = 1; k <= n; k++) {
        const t = k / (n + 1);
        drift = drift * 0.55 + (r() - 0.5) * k0; // correlated wobble reads as a natural edge, not noise
        const along = (r() - 0.5) * (len / n) * 0.35;
        out.push([x0 + (x1 - x0) * t + nx * drift + ((x1 - x0) / len) * along, y0 + (y1 - y0) * t + ny * drift + ((y1 - y0) / len) * along]);
      }
    }
    idx.push(out.length);
    out.push(a[a.length - 1]);
    out.idx = idx;
    return out;
  }

  /* mountain range with lit and shadow planes (light from left by default) */
  function range(P, r, o) {
    const { main, base, v, shade: shadeV = v + 2, snow = 0, light = 'left', hatchOp = 0.45 } = o;
    const shadeP = shade;
    const ridge = jag(main, o.jag ?? 10, r, 2);
    const body = ridge.concat([[W + 10, base], [-10, base]]);
    let s = tone(P, body, v) + (v >= 2 ? hatch(body, light === 'left' ? 'b' : 'd', Math.min(0.3, hatchOp * 0.45 + v * 0.02)) : '');
    const idx = ridge.idx;
    for (let i = 1; i < main.length - 1; i++) {
      const isPeak = main[i][1] < main[i - 1][1] && main[i][1] < main[i + 1][1];
      if (!isPeak) continue;
      const pk = main[i];
      const dir = light === 'left' ? 1 : -1;
      const j = i + dir;
      const seg = dir === 1 ? ridge.slice(idx[i], idx[j] + 1) : ridge.slice(idx[j], idx[i] + 1).reverse();
      const val = main[j];
      const footX = pk[0] + (val[0] - pk[0]) * 0.18;
      const mid1 = [pk[0] + (footX - pk[0]) * 0.35 + (r() - 0.5) * 12, pk[1] + (base - pk[1]) * 0.35];
      const mid2 = [pk[0] + (footX - pk[0]) * 0.7 + (r() - 0.5) * 12, pk[1] + (base - pk[1]) * 0.7];
      const poly = seg.concat([[val[0], base], [footX, base], mid2, mid1]);
      s += shadeP(P, poly, shadeV);
      s += hatch(poly, light === 'left' ? 'd' : 'b', hatchOp);
      if (snow && pk[1] < snow) {
        const sl = Math.min(60, (snow - pk[1]) * 0.9);
        const L = ridge[Math.max(0, idx[i] - 2)], R = ridge[Math.min(ridge.length - 1, idx[i] + 2)];
        const lx = pk[0] + (L[0] - pk[0]) * 0.55, ly = pk[1] + (L[1] - pk[1]) * 0.55;
        const rx = pk[0] + (R[0] - pk[0]) * 0.55, ry = pk[1] + (R[1] - pk[1]) * 0.55;
        const cap = [pk, [rx, ry], [pk[0] + (rx - pk[0]) * 0.5 + 4, pk[1] + sl * 0.7], [pk[0] + 2, pk[1] + sl * 0.45], [pk[0] - 6, pk[1] + sl * 0.8], [lx, ly]];
        s += shade(P, cap, light === 'left' ? 0 : 1);
      }
    }
    s += sketch(ridge, P(Math.min(8, v + 3)), 1.1, 0.55);
    return s;
  }

  function pine(P, r, x, by, h, v, opt = {}) {
    const w = (opt.w || 0.34) * h;
    const n = Math.max(4, Math.round(h / (opt.tier || 9)));
    const right = [], left = [];
    for (let k = 1; k <= n; k++) {
      const t = k / n;
      const y = by - h + h * t * 0.93;
      const hw = w * Math.pow(t, 0.85) * (0.85 + r() * 0.3);
      right.push([x + hw, y + (r() - 0.3) * 2]);
      if (k < n) right.push([x + hw * 0.42, y + h / n * 0.2]);
      left.unshift([x - hw * (0.9 + r() * 0.2), y + (r() - 0.3) * 2]);
      if (k < n) left.unshift([x - hw * 0.42, y + h / n * 0.2]);
    }
    const body = [[x, by - h]].concat(right, [[x + 2, by - h * 0.05], [x - 2, by - h * 0.05]], left);
    let s = tone(P, body, v);
    if (opt.shade !== false && h > 40) {
      const sh = [[x, by - h]].concat(right, [[x + 1, by - h * 0.05]]);
      s += tone(P, sh, Math.min(8, v + 1));
      if (h > 90) s += hatch(sh, 'v', 0.35);
    }
    s += `<rect class="tone" x="${f(x - h * 0.018 - 0.6)}" y="${f(by - h * 0.07)}" width="${f(h * 0.036 + 1.2)}" height="${f(h * 0.07)}" fill="${P(Math.min(8, v + 1))}"/>`;
    return s;
  }

  function treeline(P, r, x0, x1, by, hmin, hmax, v, step = 7) {
    let s = '';
    for (let x = x0; x < x1; x += step * (0.6 + r() * 0.8)) s += pine(P, r, x, by + r() * 2, hmin + r() * (hmax - hmin), v, { shade: false });
    return s;
  }

  function oak(P, r, x, by, h, v, opt = {}) {
    const tw = h * 0.07;
    const trunk = [[x - tw, by], [x - tw * 0.45, by - h * 0.5], [x - tw * 1.3, by - h * 0.66], [x - tw * 0.2, by - h * 0.58], [x + tw * 0.2, by - h * 0.7], [x + tw * 0.5, by - h * 0.55], [x + tw * 1.4, by - h * 0.63], [x + tw * 0.45, by - h * 0.48], [x + tw, by]];
    let s = tone(P, trunk, Math.min(8, v + 2));
    const cx = x + (opt.lean || 0), cy = by - h * 0.7;
    const blobs = [];
    const n = 9;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + r() * 0.4;
      const rr = h * (0.13 + r() * 0.09);
      blobs.push([cx + Math.cos(a) * h * 0.2, cy + Math.sin(a) * h * 0.13 - h * 0.03, rr]);
    }
    blobs.push([cx, cy - h * 0.06, h * 0.22]);
    s += blobs.map((b) => `<circle class="tone" cx="${f(b[0])}" cy="${f(b[1])}" r="${f(b[2])}" fill="${P(v)}"/>`).join('');
    // form shadow: lower-right (light from left)
    const sgn = opt.light === 'right' ? -1 : 1;
    s += blobs.filter((b) => (b[0] - cx) * sgn > -h * 0.02 && b[1] > cy - h * 0.1).map((b) => `<circle class="tone" cx="${f(b[0] + sgn * b[2] * 0.25)}" cy="${f(b[1] + b[2] * 0.25)}" r="${f(b[2] * 0.72)}" fill="${P(Math.min(8, v + 2))}"/>`).join('');
    s += blobs.filter((b) => (b[0] - cx) * sgn < 0 && b[1] < cy).map((b) => `<circle class="tone" cx="${f(b[0] - sgn * b[2] * 0.2)}" cy="${f(b[1] - b[2] * 0.2)}" r="${f(b[2] * 0.5)}" fill="${P(Math.max(0, v - 1))}"/>`).join('');
    return s;
  }

  function bareTree(P, r, x, by, h, v, w = 1.6) {
    let s = '';
    const c = P(v);
    function br(x0, y0, ang, len, wd, d) {
      const x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len;
      s += stroke(x0, y0, x1, y1, c, wd, 'tone-l');
      if (d > 4 || len < 5) return;
      const k = 1 + (r() > 0.4 ? 1 : 0);
      for (let i = 0; i <= k; i++) br(x1, y1, ang + (r() - 0.5) * 1.1 + (i - k / 2) * 0.5, len * (0.62 + r() * 0.16), wd * 0.62, d + 1);
    }
    br(x, by, -Math.PI / 2 + (r() - 0.5) * 0.2, h * 0.34, w * h / 40, 0);
    return s;
  }

  function grass(P, r, x0, x1, y, h, v, n = 20) {
    let s = '';
    for (let i = 0; i < n; i++) {
      const x = x0 + r() * (x1 - x0), hh = h * (0.4 + r() * 0.8), lean = (r() - 0.5) * hh * 0.8;
      s += stroke(x, y + r() * 3, x + lean, y - hh, P(v), 0.9);
    }
    return s;
  }

  function cloud(P, r, x, y, w, v, flat = true) {
    const id = 'cl' + (++uid);
    const n = 5 + Math.floor(r() * 3);
    let c = '';
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const rr = w * (0.13 + Math.sin(t * Math.PI) * 0.14 + r() * 0.05);
      c += `<circle cx="${f(x - w / 2 + t * w)}" cy="${f(y - rr * 0.55)}" r="${f(rr)}"/>`;
    }
    const top = y - w * 0.4;
    return `<g class="tone-g"><clipPath id="${id}"><rect x="${f(x - w)}" y="${f(top - w)}" width="${f(w * 2)}" height="${f(y - top + w)}"/></clipPath>` +
      `<g clip-path="url(#${id})" fill="${P(v)}" class="tone">${c}</g>` +
      `<g clip-path="url(#${id})" fill="${P(Math.min(8, v + 1))}" class="tone" transform="translate(0 ${f(w * 0.06)})" opacity=".85">${c.replace(/r="([\d.]+)"/g, (m, a) => `r="${f(a * 0.8)}"`)}</g>` +
      hatch([[x - w * 0.55, y - w * 0.12], [x + w * 0.55, y - w * 0.12], [x + w * 0.5, y], [x - w * 0.5, y]], 'h', 0.28) + `</g>`;
  }

  function rock(P, r, x, by, w, h, v, light = 'left') {
    const j = () => (r() - 0.5) * w * 0.08;
    const topL = [x - w * 0.46 + j(), by - h * 0.62], topR = [x + w * 0.36 + j(), by - h * 0.7];
    const peak = [x - w * 0.05 + j(), by - h];
    const back = [x + w * 0.2 + j(), by - h * 0.92];
    const top = [topL, peak, back, topR, [x + w * 0.05, by - h * 0.55]];
    const front = [topL, [x + w * 0.05, by - h * 0.55], [x + w * 0.1 + j(), by], [x - w * 0.5, by]];
    const side = [[x + w * 0.05, by - h * 0.55], topR, [x + w * 0.5, by - h * 0.25 + j()], [x + w * 0.46, by], [x + w * 0.1, by]];
    const L = light === 'left';
    let s = tone(P, top, Math.max(0, v - 2)) + tone(P, front, L ? v : v + 2) + tone(P, side, L ? v + 2 : v);
    s += hatch(L ? side : front, 'd', 0.5) + sketch([topL, peak, back, topR, [x + w * 0.5, by - h * 0.25], [x + w * 0.46, by]], P(Math.min(8, v + 3)), 1, 0.5) + sketch([topL, [x - w * 0.5, by]], P(Math.min(8, v + 3)), 1, 0.45);
    s += `<path class="tone" d="${dPath([[x - w * 0.6, by], [x + w * 0.62, by], [x + w * 0.5 + (L ? w * 0.4 : -w * 0.9), by + h * 0.12], [x - w * 0.3, by + h * 0.1]])}" fill="${P(Math.min(8, v + 1))}" opacity=".55"/>`;
    return { svg: s, top, front, side };
  }

  function water(P, r, y0, y1, v, n = 60, x0 = 0, x1 = W) {
    let s = `<rect class="tone" x="${x0}" y="${f(y0)}" width="${x1 - x0}" height="${f(y1 - y0)}" fill="${P(v)}"/>` + hatch([[x0, y0 + (y1 - y0) * 0.35], [x1, y0 + (y1 - y0) * 0.3], [x1, y1 + 5], [x0, y1 + 5]], 'h', 0.16);
    for (let i = 0; i < n; i++) {
      const y = y0 + 4 + Math.pow(r(), 0.8) * (y1 - y0 - 4);
      const len = 8 + ((y - y0) / (y1 - y0)) * 60 * r();
      const x = x0 + r() * (x1 - x0);
      s += stroke(x, y, x + len, y, P(Math.min(8, v + 2)), 0.6 + ((y - y0) / (y1 - y0)) * 0.9);
    }
    return s;
  }
  function reflect(inner, y, y0, y1, op = 0.38) {
    const id = 'rf' + (++uid);

  }

    let s = '';

      const y = y0 + 3 + r() * (y1 - y0 - 3), x = r() * W;
      s += stroke(x, y, x + 20 + r() * 70, y, P(1), 1.1);
    }
    return s;
  }

  /* Lakeside cabin in two-point perspective. */
  S.cabin = function (P, o) {
    const r = rng(o.seed || 3);
    const hy = 300, vl = [60, hy], vr = [1500, hy];
    const at = (from, to, x) => [x, from[1] + (to[1] - from[1]) * ((x - from[0]) / (to[0] - from[0]))];
    const cx = 540, top = 204, bot = 272;
    const L = 470, R = 640;
    const tl = at([cx, top], vl, L), bl = at([cx, bot], vl, L);
    const tr = at([cx, top], vr, R), br = at([cx, bot], vr, R);
    const midR = (cx + R) / 2, pkR = [midR, top - 58];
    const ridgeL = at(pkR, vl, L + (midR - cx) * 0.55);
    const sky = `<rect class="tone" width="${W}" height="${hy}" fill="${P(0)}"/>` + skyTone(hy);
    const mts = range(P, r, { main: [[-10, 250], [80, 200], [190, 244], [300, 150], [400, 230], [470, 196], [560, 250], [810, 260]], base: hy, v: 1, shade: 2, hatchOp: 0.25, snow: 170 });
    const bgTrees = treeline(P, r, 0, 330, hy + 2, 14, 46, 3, 10) + pine(P, r, 120, hy + 4, 96, 3, { shade: false }) + pine(P, r, 200, hy + 4, 76, 3, { shade: false });
    const island = [[380, 292], [440, 262], [520, 268], [600, 262], [700, 280], [740, 312], [360, 318]];
    const rk = tone(P, jag(island, 10, r), 5) + hatch(island, 'd', 0.5) + rock(P, r, 440, 318, 90, 40, 4).svg + rock(P, r, 690, 318, 100, 36, 4).svg;
    const front = [tl, [cx, top], [cx, bot], bl];
    const side = [[cx, top], tr, br, [cx, bot]];
    const gable = [[cx, top], pkR, tr];
    const roof = [ridgeL, pkR, [cx, top], [tl[0] - 8, tl[1] + 3]];
    let cabin = tone(P, front, 3) + tone(P, side, 6) + hatch(side, 'd', 0.5) + tone(P, gable, 5) + tone(P, roof, 2);
    for (let k = 1; k < 5; k++) { const a = at([cx, top + k * 14], vl, L); cabin += stroke(cx, top + k * 14, a[0], a[1], P(5), 0.8); }
    const win = [at([cx, 226], vl, 520), [cx - 12, 0]];
    const w1 = at([cx, 222], vl, 512), w2 = at([cx, 222], vl, 490), w3 = at([cx, 246], vl, 490), w4 = at([cx, 246], vl, 512);
    cabin += tone(P, [w1, w2, w3, w4], 7);
    const d1 = [576, 232 + (596 - 540) * 0], door = [[574, at([cx, 226], vr, 574)[1]], [596, at([cx, 226], vr, 596)[1]], [596, at([cx, bot], vr, 596)[1]], [574, at([cx, bot], vr, 574)[1]]];
    cabin += tone(P, door, 8);
    cabin += `<rect class="tone" x="${f(ridgeL[0] + 18)}" y="${f(ridgeL[1] - 34)}" width="12" height="30" fill="${P(6)}"/>`;
    const trees = pine(P, r, 700, 300, 250, 7) + pine(P, r, 752, 304, 190, 8) + pine(P, r, 650, 290, 130, 6);
    const wtr = water(P, r, hy + 18, H, 1, 40);
    const refl = reflect(mts + bgTrees + rk + cabin + trees, 318, 318, H, 0.3) + ripplesOver(P, r, 322, H, 30);
    const fg = grass(P, r, 0, 260, 496, 26, 7, 40) + tone(P, [[-10, 470], [120, 456], [240, 480], [280, H + 5], [-10, H + 5]], 6);
    const layers = [
      { id: 'sky', label: 'Sky', svg: sky },

  /* Stone bridge: darkest dark sits under the arch, next to the lightest water. */
  S.bridge = function (P, o) {
    const r = rng(o.seed || 21);
    const hy = 250;
    const sky = `<rect class="tone" width="${W}" height="${H}" fill="${P(0)}"/>`;
    let bg = treeline(P, r, 0, 800, 262, 20, 60, o.flat ? 6 : 2, 12);
    bg += bareTree(P, r, 90, 300, 190, o.flat ? 7 : 5, 1.6) + bareTree(P, r, 720, 290, 170, o.flat ? 7 : 5, 1.4) + bareTree(P, r, 640, 280, 120, o.flat ? 6 : 3, 1.1);
    const banks = [[-10, 270], [210, 262], [260, 300], [180, 360], [-10, 380]];
    const banksR = [[810, 270], [590, 262], [540, 300], [620, 360], [810, 380]];
    let bank = tone(P, jag(banks, 8, r), 4) + tone(P, jag(banksR, 8, r), 4) + grass(P, r, 0, 200, 300, 12, 6, 30) + grass(P, r, 600, 800, 300, 12, 6, 30);
    const cxA = 400, deck = 190, spring = 318, span = 300, rise = 118;
    const outer = []; const inner = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24, a = Math.PI * (1 - t);
      outer.push([cxA + Math.cos(a) * (span / 2 + 34), spring - Math.sin(a) * (rise + 30)]);
      inner.push([cxA + Math.cos(a) * span / 2, spring - Math.sin(a) * rise]);
    }
    // abutments splay into the banks instead of ending in hard vertical edges
    const bridgeBody = [...jag([[128, deck + 6], [260, deck - 1], [400, deck - 3], [540, deck], [672, deck + 5]], 3, r), [690, 300], [720, 334], ...inner.slice().reverse(), [80, 336], [112, 298]];
    const under = [...inner, [cxA + span / 2, spring + 10], [cxA - span / 2, spring + 10]];
    let br = tone(P, bridgeBody, 3) + hatch(bridgeBody, 'd', 0.3) + tone(P, under, o.flat ? 5 : 8) + hatch(under, 'x', 0.45);
    // stone courses: short, uneven block lines rather than a ruled grid
    let courses = '';
    for (let yy = deck + 16; yy < 318; yy += 14 + r() * 5) {
      for (let xx = 130 + r() * 20; xx < 690; xx += 28 + r() * 22) {
        const cx = xx - cxA, cy = yy - spring, inside = (cx * cx) / ((span / 2 + 30) ** 2) + (cy * cy) / ((rise + 26) ** 2) < 1 && yy > spring - rise - 26;
        if (inside) continue;
        const len = 14 + r() * 16;
        courses += `M${f(xx)} ${f(yy + (r() - 0.5) * 2)}L${f(xx + len)} ${f(yy + (r() - 0.5) * 2)}M${f(xx + len + 2)} ${f(yy - 2)}L${f(xx + len + 3)} ${f(yy - 11)}`;
      }
    }
    br += `<path class="fx" d="${courses}" fill="none" stroke="${P(6)}" stroke-width=".9" stroke-linecap="round" opacity=".55"/>` + sketch(bridgeBody.slice(0, 7), P(7), 1.2, 0.6);
    for (let i = 0; i < 24; i += 2) { const a = outer[i], b = inner[i]; br += stroke(a[0], a[1], b[0], b[1], P(6), 1.1, 'ln'); }
    br += `<polyline class="ln" points="${pts(outer)}" fill="none" stroke="${P(6)}" stroke-width="1.3"/>`;
    for (let x = 150; x < 650; x += 22) br += stroke(x, deck + 3, x + 14, deck + 3, P(6), 1, 'fx');
    br += tone(P, jag([[126, deck + 4], [400, deck - 5], [674, deck + 3], [674, deck - 8], [400, deck - 16], [126, deck - 7]], 2, r), 5) + sketch(jag([[126, deck - 7], [400, deck - 16], [674, deck - 8]], 2, r), P(8), 1.1, 0.6);
    const wtr = water(P, r, 318, H, 1, 40);
    const refl = reflect(br, 322, 322, H, 0.3) + ripplesOver(P, r, 326, H, 34);
    let rocks = '';
    [[60, 440, 120, 50], [180, 410, 90, 40], [640, 430, 130, 56], [740, 470, 110, 50], [300, 490, 80, 30]].forEach(([x, y, w, h]) => { rocks += rock(P, r, x, y, w, h, 4).svg; });
    const layers = [
      { id: 'sky', label: 'Sky', svg: sky },
      { id: 'bg', label: 'Background trees', svg: bg },
      { id: 'banks', label: 'River banks', svg: bank },
      { id: 'water', label: 'River', svg: wtr + refl },
      { id: 'bridge', label: 'Stone arch', svg: br },
      { id: 'rocks', label: 'Foreground rocks', svg: rocks },
    ];
    const meta = {
      horizon: hy, focal: [400, 280], light: 'left',
      probes: [{ x: 400, y: 290, v: 8, label: 'Under the arch' }, { x: 420, y: 420, v: 1, label: 'River' }, { x: 520, y: 206, v: 3, label: 'Bridge stones' }, { x: 60, y: 60, v: 0, label: 'Sky' }],
      regions: {
        under: { label: 'Under the arch', poly: under },
        bridge: { label: 'Bridge face', poly: [[140, deck], [660, deck], [660, 230], [140, 230]] },
        water: { label: 'River', poly: [[200, 380], [600, 380], [600, 470], [200, 470]] },
        sky: { label: 'Sky', poly: [[0, 0], [800, 0], [800, 120], [0, 120]] },
      },
    };
    return { layers, meta };

  /* One-point road to the horizon: diminishing poles and clouds. */
  S.road = function (P, o) {
    const r = rng(o.seed || 17);
    const hy = o.h ?? 262, vp = [o.vx ?? 500, hy];
    const sky = `<rect class="tone" width="${W}" height="${hy}" fill="${P(0)}"/>` + skyTone(hy);
    let clouds = '';
    const rows = [[60, 190, 1], [140, 120, 1], [196, 70, 2], [226, 40, 2], [242, 24, 2]];
    rows.forEach(([y, w, v], i) => { for (let k = 0; k < 3; k++) { const x = 80 + k * 280 + r() * 80 + i * 20; clouds += cloud(P, r, x, y * (hy / 262), w * (0.8 + r() * 0.4), o.flatClouds ? 1 : v); } });
    const hills = tone(P, jag([[-10, hy], [160, hy - 18], [330, hy - 6], [460, hy - 22], [620, hy - 8], [810, hy - 16]], 5, r).concat([[810, hy + 1], [-10, hy + 1]]), 2);

    const road = [[vp[0] - 1, hy], [vp[0] + 1, hy], [vp[0] + 330, H + 5], [vp[0] - 390, H + 5]];

  /* Backlit coast: dramatic lighting, low-key, silhouettes. */

  /* Basic forms on a ground plane, light from one side. */
  S.forms = function (P, o) {
    const light = o.light || 'left';
    const L = light === 'left';
    const hy = 250;
    const bg = `<rect class="tone" width="${W}" height="${hy}" fill="${P(1)}"/><rect class="tone" x="0" y="${hy}" width="${W}" height="${H - hy}" fill="${P(3)}"/>`;
    const d = L ? 1 : -1;
    // sphere
    const sx = 150, sy = 330, sr = 62;
    let sp = `<ellipse class="tone" cx="${sx + d * 70}" cy="${sy + sr - 4}" rx="${sr + 30}" ry="16" fill="${P(6)}"/>`;
    const spId = 'cl' + (++uid);
    sp += `<clipPath id="${spId}"><circle cx="${sx}" cy="${sy}" r="${sr}"/></clipPath>`;
    sp += `<circle class="tone" cx="${sx}" cy="${sy}" r="${sr}" fill="${P(6)}"/>`;

    cy += `<path class="tone" d="M${yx - yr} ${yt} L${yx - yr} ${yb} A ${yr} 10 0 0 0 ${yx + yr} ${yb} L${yx + yr} ${yt} Z" fill="${P(2)}"/>`;

    return { layers, meta };

  /* Overlapping ranges for atmospheric perspective. mode: correct | reversed | flat */
  S.ranges = function (P, o) {
